<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1280" width="1200" height="1280" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">VF2 Model 2A Wasm実装：データ経路と実行・同期イベント</title><desc id="diagram-desc">実機の配線図ではありません。青実線は確認できたデータ・メモリアクセス、紫破線はスケジューラーの実行とイベントです。TGPの解釈実行とgeometry HLEは別経路。UARTはSCSPへの音声コマンド系。ブロック数はWorker数を示しません。</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;fill:#152334}.head{font-size:28px;font-weight:700}.label{font-size:23px;font-weight:700}.small{font-size:19px}.edge{font-size:18px;fill:#075cbe}.sync-label{font-size:20px;fill:#6744a0}.box{fill:#fff;stroke:#9ab3cd;stroke-width:2}.data{fill:none;stroke:#075cbe;stroke-width:3}.sync{fill:none;stroke:#7952aa;stroke-width:3;stroke-dasharray:9 6}</style><defs><marker id="data-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#075cbe" /></marker><marker id="sync-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7952aa" /></marker></defs><rect width="1200" height="1280" fill="#f9fbfd" /><rect x="20" y="20" width="1160" height="865" rx="16" fill="#eef4fa" stroke="#dce3eb" /><text x="45" y="65" class="head">1. データ経路 — ソフトウェア実装の要約</text><text x="45" y="100" class="small">VF2 Version 2.1 / Model 2A 向けポート。実機の配線・チップ配置図ではありません。</text><g data-node="i960"><rect x="60" y="210" width="250" height="110" rx="12" class="box" /><text x="78" y="245" class="label">i960</text><text x="78" y="276" class="small">生成コードで実行</text><text x="78" y="303" class="small">必要時は解釈実行へ</text></g><g data-node="TGP"><rect x="420" y="210" width="300" height="110" rx="12" class="box" /><text x="438" y="245" class="label">TGP</text><text x="438" y="276" class="small">MB86234用プログラム</text><text x="438" y="303" class="small">mb86233_deviceで解釈</text></g><g data-node="UART"><rect x="850" y="210" width="285" height="110" rx="12" class="box" /><text x="868" y="245" class="label">UART</text><text x="868" y="276" class="small">i8251送信側の実装</text><text x="868" y="303" class="small">SCSPへの音声コマンド</text></g><g data-node="共有バッファ"><rect x="150" y="410" width="315" height="100" rx="12" class="box" /><text x="168" y="445" class="label">共有バッファ</text><text x="168" y="476" class="small">i960 / TGP のアクセス</text></g><g data-node="geometry HLE"><rect x="555" y="410" width="250" height="100" rx="12" class="box" /><text x="573" y="445" class="label">geometry HLE</text><text x="573" y="476" class="small">Model 2 / 2A用</text></g><g data-node="3D描画"><rect x="555" y="570" width="250" height="110" rx="12" class="box" /><text x="573" y="605" class="label">3D描画</text><text x="573" y="636" class="small">Z-sort・クリップ</text><text x="573" y="663" class="small">ソフトウェア描画</text></g><g data-node="2Dタイル"><rect x="150" y="710" width="260" height="100" rx="12" class="box" /><text x="168" y="745" class="label">2Dタイル</text><text x="168" y="776" class="small">ホスト側のタイル描画</text></g><g data-node="合成・色変換"><rect x="555" y="710" width="250" height="100" rx="12" class="box" /><text x="573" y="745" class="label">合成・色変換</text><text x="573" y="776" class="small">3Dと2Dから画面出力</text></g><g data-node="SCSP"><rect x="850" y="410" width="285" height="110" rx="12" class="box" /><text x="868" y="445" class="label">SCSP</text><text x="868" y="476" class="small">MIDI入力・レジスタ</text><text x="868" y="503" class="small">音声処理</text></g><g data-node="68000"><rect x="850" y="600" width="285" height="110" rx="12" class="box" /><text x="868" y="635" class="label">68000</text><text x="868" y="666" class="small">サウンドCPU実行</text><text x="868" y="693" class="small">SCSPレジスタを操作</text></g><path d="M 310 265 L 420 265" class="data" marker-end="url(#data-arrow)" marker-start="url(#data-arrow)" /><text x="332" y="247" class="edge">FIFO</text><path d="M 185 210 L 185 160 L 992 160 L 992 210" class="data" marker-end="url(#data-arrow)" /><text x="735" y="148" class="edge">音声コマンド</text><path d="M 185 320 L 185 410" class="data" marker-end="url(#data-arrow)" /><text x="198" y="370" class="edge">書き込み</text><path d="M 570 320 L 570 365 L 415 365 L 415 410" class="data" marker-end="url(#data-arrow)" marker-start="url(#data-arrow)" /><text x="435" y="349" class="edge">読出し／書込み</text><path d="M 465 460 L 555 460" class="data" marker-end="url(#data-arrow)" /><text x="475" y="445" class="edge">描画データ</text><path d="M 680 510 L 680 570" class="data" marker-end="url(#data-arrow)" /><path d="M 680 680 L 680 710" class="data" marker-end="url(#data-arrow)" /><path d="M 410 760 L 555 760" class="data" marker-end="url(#data-arrow)" /><text x="426" y="742" class="edge">2D画像</text><path d="M 680 810 L 680 845" class="data" marker-end="url(#data-arrow)" /><text x="697" y="846" class="edge">画面送信へ</text><path d="M 992 320 L 992 410" class="data" marker-end="url(#data-arrow)" /><text x="1006" y="370" class="edge">MIDI入力</text><path d="M 1100 520 L 1100 600" class="data" marker-end="url(#data-arrow)" marker-start="url(#data-arrow)" /><text x="850" y="567" class="edge">レジスタ read / write</text><path d="M 1135 465 L 1155 465 L 1155 800 L 1000 800" class="data" marker-end="url(#data-arrow)" /><text x="855" y="805" class="edge">PCM出力</text><text x="1036" y="782" class="edge">音声データ</text><text x="60" y="875" class="small">TGP命令実行とgeometry HLEは別。TGP → geometry の直結は描いていません。</text><rect x="20" y="910" width="1160" height="255" rx="16" fill="#f3eef9" stroke="#d8cce9" /><text x="45" y="955" class="head">2. 実行・同期イベント — データ経路とは別の関係</text><g data-node="スケジューラー"><rect x="60" y="1000" width="310" height="115" rx="12" class="box" /><text x="78" y="1035" class="label">スケジューラー</text><text x="78" y="1066" class="small">CPU予算・sliceを調停</text><text x="78" y="1093" class="small">時刻とタイマーを管理</text></g><g data-node="i960・TGP・68000"><rect x="525" y="980" width="610" height="75" rx="12" class="box" /><text x="543" y="1015" class="label">i960・TGP・68000</text><text x="543" y="1046" class="small">実行予算を割り当て、各CPUを実行</text></g><g data-node="UART・SCSP・描画のタイマー"><rect x="525" y="1075" width="610" height="75" rx="12" class="box" /><text x="543" y="1110" class="label">UART・SCSP・描画のタイマー</text><text x="543" y="1141" class="small">タイマー発火／FIFO empty・full の同期</text></g><path d="M 370 1030 L 450 1030 L 450 1018 L 525 1018" class="sync" marker-end="url(#sync-arrow)" /><path d="M 370 1080 L 450 1080 L 450 1112 L 525 1112" class="sync" marker-end="url(#sync-arrow)" /><path d="M 45 1210 L 125 1210" class="data" marker-end="url(#data-arrow)" /><text x="145" y="1217" class="small">青実線：データ／メモリアクセス</text><path d="M 655 1210 L 735 1210" class="sync" marker-end="url(#sync-arrow)" /><text x="755" y="1217" class="small">紫破線：実行／同期イベント</text><text x="45" y="1255" class="small">双方向矢印はアクセス方向を要約。ブロック数・矢印幅はWorker数や負荷率を表しません。</text></svg>